<div class="checkout-container">
  
  <h1 class="page-title">Checkout 💳</h1>

  <div class="checkout-layout">
    
    <div class="billing-form">
      <h2>Billing Details</h2>
      
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="checkoutObj.name" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="checkoutObj.email" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label>Shipping Address</label>
        <textarea [(ngModel)]="checkoutObj.address" rows="3" placeholder="123, Street Name, City"></textarea>
      </div>

      <div class="form-group">
        <label>Card Number (Fake)</label>
        <input type="text" [(ngModel)]="checkoutObj.card" placeholder="XXXX-XXXX-XXXX-XXXX">
      </div>

    </div>

    <div class="order-summary">
      <h2>Your Order</h2>
      
      <div class="summary-item" *ngFor="let item of cartItems">
        <span>{{ item.title.substring(0, 20) }}...</span>
        <span>${{ item.price }}</span>
      </div>
      
      <hr>
      
      <div class="total-row">
        <span>Total Amount</span>
        <span class="total-price">${{ totalAmount.toFixed(2) }}</span>
      </div>

      <button (click)="placeOrder()" class="place-order-btn">
        Place Order ✅
      </button>
    </div>

  </div>
</div>
